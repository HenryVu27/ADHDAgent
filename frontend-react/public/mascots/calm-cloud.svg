<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Calm Cloud - safety/reassurance mascot -->
  <defs>
    <radialGradient id="cloudGrad" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#EAF5FD"/>
      <stop offset="100%" stop-color="#C8E4F5"/>
    </radialGradient>
    <radialGradient id="heartGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FF9E9E"/>
      <stop offset="100%" stop-color="#E86B55"/>
    </radialGradient>
    <!-- Soft shadow instead of a mismatched outline -->
    <filter id="cloudSoft" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9CBCD0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Floating Z's -->
  <text x="150" y="36" font-family="Georgia, serif" font-size="15" fill="#7AA8CC" opacity="0.3" font-weight="bold">z</text>
  <text x="161" y="22" font-family="Georgia, serif" font-size="12" fill="#7AA8CC" opacity="0.2" font-weight="bold">z</text>
  <text x="169" y="12" font-family="Georgia, serif" font-size="9" fill="#7AA8CC" opacity="0.15" font-weight="bold">z</text>

  <!-- Ground shadow -->
  <ellipse cx="100" cy="170" rx="55" ry="5" fill="#D0D8E0" opacity="0.2"/>

  <!-- Cloud body - overlapping circles, NO outline (soft filter shadow instead) -->
  <g filter="url(#cloudSoft)">
    <circle cx="65" cy="100" r="36" fill="url(#cloudGrad)"/>
    <circle cx="100" cy="82" r="42" fill="url(#cloudGrad)"/>
    <circle cx="138" cy="98" r="35" fill="url(#cloudGrad)"/>
    <circle cx="80" cy="114" r="32" fill="url(#cloudGrad)"/>
    <circle cx="118" cy="112" r="34" fill="url(#cloudGrad)"/>
    <rect x="42" y="108" width="120" height="30" rx="14" fill="url(#cloudGrad)"/>
  </g>

  <!-- Inner highlights for fluffiness -->
  <circle cx="82" cy="76" r="18" fill="white" opacity="0.18"/>
  <circle cx="118" cy="80" r="14" fill="white" opacity="0.12"/>
  <circle cx="60" cy="92" r="10" fill="white" opacity="0.1"/>

  <!-- Eyes - gentle, peaceful -->
  <circle cx="80" cy="100" r="5.5" fill="#4A7A9D"/>
  <circle cx="122" cy="100" r="5.5" fill="#4A7A9D"/>
  <!-- Highlights -->
  <circle cx="82" cy="97.5" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="124" cy="97.5" r="2.5" fill="white" opacity="0.8"/>

  <!-- Gentle smile -->
  <path d="M86,114 Q101,124 116,114" fill="none" stroke="#4A7A9D" stroke-width="2" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="66" cy="108" rx="9" ry="5" fill="#FFADAD" opacity="0.3"/>
  <ellipse cx="136" cy="108" rx="9" ry="5" fill="#FFADAD" opacity="0.3"/>

  <!-- Floating heart -->
  <g>
    <path d="M101,54 C101,48 93,44 93,50 C93,55 101,62 101,62 C101,62 109,55 109,50 C109,44 101,48 101,54Z"
      fill="url(#heartGrad)" opacity="0.75"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="2.5s" repeatCount="indefinite"/>
  </g>

  <!-- Sparkle near heart -->
  <g opacity="0.5">
    <line x1="116" y1="48" x2="122" y2="48" stroke="#FFD166" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="119" y1="45" x2="119" y2="51" stroke="#FFD166" stroke-width="1.5" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </g>
</svg>