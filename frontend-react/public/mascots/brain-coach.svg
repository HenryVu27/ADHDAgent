<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Coach Buddy - friendly round coaching companion -->
  <defs>
    <radialGradient id="buddyGrad" cx="50%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#D4C8F0"/>
      <stop offset="100%" stop-color="#B0A0D4"/>
    </radialGradient>
  </defs>

  <!-- Sparkles -->
  <circle cx="34" cy="36" r="2.5" fill="#FFD166" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <g opacity="0.5">
    <line x1="160" y1="34" x2="168" y2="34" stroke="#FFD166" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="164" y1="30" x2="164" y2="38" stroke="#FFD166" stroke-width="1.5" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="100" cy="180" rx="48" ry="6" fill="#D4D0E0" opacity="0.25"/>

  <!-- Ears (drawn behind body) -->
  <circle cx="70" cy="68" r="16" fill="#B0A0D4"/>
  <circle cx="130" cy="68" r="16" fill="#B0A0D4"/>
  <!-- Inner ears -->
  <circle cx="70" cy="68" r="9" fill="#E4DAF5"/>
  <circle cx="130" cy="68" r="9" fill="#E4DAF5"/>

  <!-- Body - big soft round shape -->
  <ellipse cx="100" cy="118" rx="50" ry="55" fill="url(#buddyGrad)"/>

  <!-- Belly highlight -->
  <ellipse cx="100" cy="128" rx="32" ry="34" fill="#E4DAF5" opacity="0.45"/>

  <!-- Arms -->
  <ellipse cx="42" cy="126" rx="12" ry="20" fill="#A090C4" transform="rotate(-8 42 126)"/>
  <ellipse cx="158" cy="126" rx="12" ry="20" fill="#A090C4" transform="rotate(8 158 126)"/>

  <!-- Feet -->
  <ellipse cx="80" cy="173" rx="16" ry="7" fill="#A090C4"/>
  <ellipse cx="120" cy="173" rx="16" ry="7" fill="#A090C4"/>

  <!-- Eyes -->
  <circle cx="84" cy="104" r="8" fill="#3D3050"/>
  <circle cx="116" cy="104" r="8" fill="#3D3050"/>
  <!-- Primary highlights -->
  <circle cx="87" cy="100.5" r="3.5" fill="white"/>
  <circle cx="119" cy="100.5" r="3.5" fill="white"/>
  <!-- Secondary highlights -->
  <circle cx="82" cy="108" r="2" fill="white" opacity="0.45"/>
  <circle cx="114" cy="108" r="2" fill="white" opacity="0.45"/>

  <!-- Warm smile -->
  <path d="M86,124 Q100,138 114,124" fill="none" stroke="#3D3050" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="66" cy="116" rx="10" ry="5.5" fill="#FFADAD" opacity="0.4"/>
  <ellipse cx="134" cy="116" rx="10" ry="5.5" fill="#FFADAD" opacity="0.4"/>

  <!-- Speech bubble with heart (coaching = caring communication) -->
  <g opacity="0.9">
    <rect x="148" y="58" width="38" height="26" rx="11" fill="white" stroke="#D8D2E8" stroke-width="1.2"/>
    <polygon points="154,84 149,91 160,84" fill="white" stroke="#D8D2E8" stroke-width="1.2"/>
    <line x1="152" y1="83.5" x2="162" y2="83.5" stroke="white" stroke-width="2.5"/>
    <!-- Heart -->
    <path d="M167,66 C167,63 163,61 163,64 C163,67 167,71 167,71 C167,71 171,67 171,64 C171,61 167,63 167,66Z"
      fill="#FFADAD"/>
  </g>
</svg>