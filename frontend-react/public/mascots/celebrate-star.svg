<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Celebrate Star - achievement/progress mascot (no hat) -->
  <defs>
    <radialGradient id="cstarGlow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#FFE8A0"/>
      <stop offset="80%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F0C050"/>
    </radialGradient>
  </defs>

  <!-- Confetti -->
  <rect x="28" y="18" width="5" height="5" rx="1.5" fill="#5A84B5" transform="rotate(25,30,20)" opacity="0.8">
    <animate attributeName="y" values="18;185" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="58" cy="12" r="3" fill="#E86B55" opacity="0.7">
    <animate attributeName="cy" values="12;190" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <rect x="90" y="6" width="4" height="6" rx="1" fill="#8FC4A8" transform="rotate(40,92,9)" opacity="0.7">
    <animate attributeName="y" values="6;192" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="148" cy="14" r="3.5" fill="#8FC4A8" opacity="0.75">
    <animate attributeName="cy" values="14;190" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <rect x="168" y="22" width="5" height="5" rx="1.5" fill="#FFD166" transform="rotate(55,170,24)" opacity="0.7">
    <animate attributeName="y" values="22;185" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="130" cy="8" r="2.5" fill="#B8A9D4" opacity="0.65">
    <animate attributeName="cy" values="8;192" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;0" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Shadow -->
  <ellipse cx="100" cy="178" rx="38" ry="5" fill="#E0D8C0" opacity="0.25"/>

  <!-- Star body -->
  <polygon
    points="100,30 114,70 158,70 122,96 135,140 100,115 65,140 78,96 42,70 86,70"
    fill="url(#cstarGlow)"
    stroke="#E8B040"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Inner glow -->
  <circle cx="100" cy="90" r="26" fill="#FFF3D0" opacity="0.4"/>

  <!-- Happy closed eyes (^_^) -->
  <path d="M76,82 Q86,74 96,82" fill="none" stroke="#4A3530" stroke-width="3" stroke-linecap="round"/>
  <path d="M104,82 Q114,74 124,82" fill="none" stroke="#4A3530" stroke-width="3" stroke-linecap="round"/>

  <!-- Open happy mouth -->
  <ellipse cx="100" cy="100" rx="11" ry="9" fill="#4A3530"/>
  <ellipse cx="100" cy="98" rx="8" ry="5" fill="#FF9E9E" opacity="0.6"/>

  <!-- Blush -->
  <ellipse cx="70" cy="92" rx="9" ry="5.5" fill="#FFADAD" opacity="0.5"/>
  <ellipse cx="130" cy="92" rx="9" ry="5.5" fill="#FFADAD" opacity="0.5"/>

  <!-- Raised arms celebrating -->
  <g>
    <path d="M56,90 Q34,68 28,48" fill="none" stroke="#F0C050" stroke-width="5" stroke-linecap="round"/>
    <circle cx="26" cy="46" r="6.5" fill="#FFD88A" stroke="#E8B040" stroke-width="1.2"/>
  </g>
  <g>
    <path d="M144,90 Q166,68 172,48" fill="none" stroke="#F0C050" stroke-width="5" stroke-linecap="round"/>
    <circle cx="174" cy="46" r="6.5" fill="#FFD88A" stroke="#E8B040" stroke-width="1.2"/>
  </g>

  <!-- Small sparkle above head instead of hat -->
  <g opacity="0.7">
    <line x1="100" y1="16" x2="100" y2="24" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
    <line x1="96" y1="20" x2="104" y2="20" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </g>
</svg>